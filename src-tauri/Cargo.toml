[package]
name = "localflow"
version = "0.1.0"
description = "Local-first Windows voice app: dictation, spoken conversation with a local model, and reading aloud"
authors = ["LocalFlow contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/liulawrence2002/localflow"
homepage = "https://github.com/liulawrence2002/localflow"
readme = "../README.md"
keywords = ["dictation", "speech-to-text", "voice", "tauri", "local-first"]
categories = ["multimedia::audio", "accessibility"]
edition = "2021"
rust-version = "1.96"
# An application, not a library for crates.io.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
cpal = "0.15"
hound = "3"
# Echo cancellation for conversation mode: a pure-Rust port of the WebRTC canceller (no C or
# C++ build, nothing downloaded). Pinned exactly; see audio/echo.rs.
sonora = { version = "=0.3.0", default-features = false }
# The conversation voice (Phonon), in-process on the CPU. Pinned exactly: its API changed in
# each of 0.5, 0.6 and 0.7. Only `hf` (the tokenizer) is enabled; without `hub` the library
# cannot download anything.
ptts = { version = "=0.7.1", default-features = false, features = ["hf"] }
# The voice library's tensor backend, named only to set its thread count (see tts/phonon.rs).
xn = "0.2.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Smart Turn, the end-of-turn model conversation mode runs at each pause (audio/smart_turn.rs),
# in-process through a pure-Rust ONNX runtime. Pinned exactly: answers were checked against
# the reference runtime with this version. `multithread-mm` gives the model its own small
# thread pool; without it smart_turn.rs does not compile.
tract-linalg = { version = "=0.23.10", features = ["multithread-mm"] }
tract-onnx = { version = "=0.23.10", default-features = false }
# In-process speech-to-text (ggml). CPU build: default features would enable Metal only.
transcribe-cpp = { version = "0.4.2", default-features = false }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Only for examples/turn_judge_bench.rs, which decodes the FLAC test clips. Not linked into
# the app.
claxon = "0.4"

[features]
default = ["dev-runtime"]
# Also look for models and the whisper.cpp programs in the checkout's `.localflow-runtime`,
# and honour LOCALFLOW_WHISPER_CLI (see src/runtime_paths.rs). On by default so a local build
# keeps using its checkout. The release workflow builds with --no-default-features: the
# executable then carries no build-machine path and runs programs only from its resource
# folder and %LOCALAPPDATA%\LocalFlow.
dev-runtime = []
# Speech recognition on a discrete GPU through Vulkan, with the CPU as the fallback (see
# src/asr/transcribe_cpp.rs). Off by default. Building it needs the Vulkan SDK: VULKAN_SDK
# set, %VULKAN_SDK%\Bin (glslc) on PATH and %VULKAN_SDK%\Lib on LIB, or linking fails with
# LNK1181 vulkan-1.lib. The statically linked executable then imports vulkan-1.dll.
gpu-vulkan = ["transcribe-cpp/vulkan"]

[profile.release.package.localflow]
# No symbols and no PDB path in the shipped executable (rustc links it with /DEBUG:NONE).
# Set for this package only: the link of `localflow.exe` is all it affects, and a
# profile-wide `[profile.release] strip` would change every dependency's build hash and
# rebuild the whole release cache (C++ speech engine included) under new file names.
strip = "symbols"
