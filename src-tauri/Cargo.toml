[package]
name = "localflow"
version = "0.1.0"
description = "Local-first desktop dictation"
authors = ["LocalFlow contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
cpal = "0.15"
hound = "3"
# Echo cancellation for conversation mode: a pure-Rust port of the WebRTC canceller (no C or
# C++ build, nothing downloaded). Pinned exactly; see audio/echo.rs.
sonora = { version = "=0.3.0", default-features = false }
# The conversation voice (Phonon), in-process on the CPU. Pinned exactly: its API changed in
# each of 0.5, 0.6 and 0.7. Only `hf` (the tokenizer) is enabled; without `hub` the library
# cannot download anything.
ptts = { version = "=0.7.1", default-features = false, features = ["hf"] }
# The voice library's tensor backend, named only to set its thread count (see tts/phonon.rs).
xn = "0.2.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# In-process speech-to-text (ggml). CPU build: default features would enable Metal only.
transcribe-cpp = { version = "0.4.2", default-features = false }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
