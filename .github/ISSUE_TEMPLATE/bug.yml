name: Bug report
description: Something in LocalFlow does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.

        **Never paste transcripts, dictated text, page text or personal paths** (anything with
        your user name, such as `C:\Users\<name>\...`). Describe what you said or read in general
        terms instead ("a two-sentence email", "a news article"). Replace your user name in
        any log line with `<user>`.

        For a security problem, do not open an issue: use
        [private vulnerability reporting](https://github.com/liulawrence2002/localflow/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation
        - Conversation
        - Reading a window aloud
        - Voice commands for coding agents
        - Settings window
        - Installer or model scripts
        - Building from source
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Notepad and click into it.
        2. Press Ctrl+Alt+Space and say a short sentence.
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LocalFlow version
      description: Settings > About, or the release you installed. For a source build, the commit.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Installer from GitHub Releases (.msi)
        - Installer from GitHub Releases (-setup.exe)
        - Built from source (CPU)
        - Built from source (GPU, gpu-vulkan)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Computer and models
      description: |
        Windows version, CPU and GPU, and the readiness checklist in Settings (which models are
        installed, which Ollama model). Leave out paths.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings > Diagnostics shows timings and the speech engine without your dictated text.
        Check it for anything personal before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report contains no transcripts, dictated or page text, and no paths with my user name.
          required: true
