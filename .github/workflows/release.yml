name: Release

# Builds the Windows installers for a version tag (v0.1.0, v0.2.0, ...) and attaches them,
# with SHA256SUMS, to a draft GitHub release. A maintainer reviews the draft and publishes it.
#
# The release build:
# - is the CPU build (no `gpu-vulkan`), so it runs on any Windows 11 computer;
# - is built with --no-default-features, which turns off `dev-runtime`: the executable carries
#   no build-machine path and runs programs only from its own folders;
# - remaps the workspace and Cargo's home in debug paths;
# - ships the whisper.cpp fallback and tiny.en, fetched and hash-checked by the same scripts
#   developers use, plus the Visual C++ runtime DLLs next to the programs that need them.
# It uses no dependency caches, so nothing restored from another run can reach a release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write # create the draft release and upload to it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $package = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$package") { throw "Tag $env:TAG does not match package.json version $package." }
          if ($cargo -ne $package) { throw "src-tauri/Cargo.toml version $cargo does not match package.json version $package." }
          "VERSION=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          # rust-toolchain.toml names the toolchain; 1.96 is the minimum in src-tauri/Cargo.toml.
          $channel = "1.96"
          if (Test-Path rust-toolchain.toml) {
            $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy
          rustup default $channel
          rustc --version
          cargo --version

      - run: npm ci

      - name: Third-party notices are up to date
        shell: pwsh
        run: ./scripts/Generate-ThirdPartyNotices.ps1 -Check

      # Pinned versions, each checked against its SHA-256 by the script.
      - name: Fetch the whisper.cpp programs and the tiny.en model
        shell: pwsh
        run: |
          ./scripts/Get-WhisperRuntime.ps1 -Destination .localflow-runtime
          ./scripts/Get-AsrModel.ps1 -Model tiny.en -Destination .localflow-runtime

      # App-local Visual C++ runtime. localflow.exe imports msvcp140.dll; the whisper.cpp
      # programs import msvcp140.dll, vcruntime140.dll and vcruntime140_1.dll, and the ggml
      # DLLs vcomp140.dll (OpenMP). Windows looks in a program's own folder first, so a copy
      # beside each program works without an administrator install of the redistributable.
      # src-tauri/tauri.release.conf.json maps these files into the installers.
      - name: Stage the Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the C++ tools was not found." }
          $versions = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending
          $crt = $null; $omp = $null
          foreach ($version in $versions) {
            $crt = Get-ChildItem (Join-Path $version.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
            $omp = Get-ChildItem (Join-Path $version.FullName "x64") -Directory -Filter "Microsoft.VC*.OpenMP" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($crt -and $omp) { Write-Host "Visual C++ redistributable $($version.Name)"; break }
          }
          if (-not ($crt -and $omp)) { throw "The x64 Visual C++ redistributable files were not found under $vs." }

          $app = New-Item -ItemType Directory -Force .localflow-runtime/vcredist
          $whisper = ".localflow-runtime/whisper/Release"
          foreach ($name in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item (Join-Path $crt.FullName $name) $app.FullName
            Copy-Item (Join-Path $crt.FullName $name) $whisper
          }
          Copy-Item (Join-Path $omp.FullName "vcomp140.dll") $whisper
          Get-ChildItem $app.FullName, "$whisper/*140*.dll" | ForEach-Object { "{0,-22} {1}" -f $_.Name, $_.VersionInfo.FileVersion }

      - name: Build the installers
        shell: pwsh
        run: |
          # Debug paths name /localflow and /cargo instead of the runner's folders.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $env:CARGO_ENCODED_RUSTFLAGS = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=/localflow",
            "--remap-path-prefix=$cargoHome=/cargo"
          ) -join [char]0x1f
          npx tauri build --config src-tauri/tauri.release.conf.json -- --no-default-features --locked
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed (exit code $LASTEXITCODE)." }

      # Every DLL a shipped program imports must be part of Windows or sit beside it. The
      # runner has the Visual C++ runtime installed system-wide, so those names must be found
      # beside the program, as they will be on a clean computer. target/release mirrors the
      # installed layout: the Tauri build copies the resources there.
      - name: Check the shipped programs' DLL imports
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -like "*\bin\Hostx64\x64\dumpbin.exe" } | Select-Object -First 1
          $release = "src-tauri/target/release"
          $programs = @(Get-Item "$release/localflow.exe", "$release/msvcp140.dll", "$release/vcruntime140.dll", "$release/vcruntime140_1.dll") +
            @(Get-ChildItem "$release/localflow-runtime/whisper/Release" -Include *.exe, *.dll -Recurse)
          $vcRuntime = "^(msvcp140.*|vcruntime140.*|vcomp140|concrt140|vccorlib140)\.dll$"
          $problems = @()
          foreach ($program in $programs) {
            $imports = & $dumpbin.FullName /nologo /dependents $program.FullName |
              Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() }
            foreach ($import in $imports) {
              if ($import -like "api-ms-win-*" -or $import -like "ext-ms-*") { continue }
              if (Test-Path -LiteralPath (Join-Path $program.DirectoryName $import)) { continue }
              $system = Test-Path -LiteralPath (Join-Path $env:SystemRoot "System32\$import")
              if ($system -and $import -notmatch $vcRuntime -and $import -ne "vulkan-1.dll") { continue }
              $problems += "$($program.Name) imports $import, which a clean Windows 11 computer would not find"
            }
          }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "All $($programs.Count) programs and libraries resolve their imports."

      - name: Report embedded build paths
        shell: pwsh
        run: |
          # Informational: C and C++ code compiled by build scripts can keep source paths in
          # assertion messages. These are runner paths, never a developer's.
          $exe = [IO.File]::ReadAllBytes((Resolve-Path src-tauri/target/release/localflow.exe))
          $text = [Text.Encoding]::GetEncoding(28591).GetString($exe)
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          foreach ($path in $env:GITHUB_WORKSPACE, $cargoHome, (Join-Path $env:GITHUB_WORKSPACE "src-tauri")) {
            $count = ([regex]::Matches($text, [regex]::Escape($path), "IgnoreCase")).Count
            Write-Host "$count occurrence(s) of $path"
          }

      - name: Collect the installers and SHA256SUMS
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $installers = @(Get-ChildItem "$bundle/msi/*.msi") + @(Get-ChildItem "$bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 2) { throw "Expected one MSI and one NSIS installer, found $($installers.Count)." }
          $out = New-Item -ItemType Directory -Force release-assets
          $installers | Copy-Item -Destination $out
          $sums = foreach ($file in Get-ChildItem $out -File) {
            "{0}  {1}" -f (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name
          }
          [IO.File]::WriteAllText((Join-Path $out "SHA256SUMS"), (($sums -join "`n") + "`n"))
          Get-Content (Join-Path $out "SHA256SUMS")

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's CHANGELOG section if there is one, then the checksums.
          $changelog = Get-Content -Raw CHANGELOG.md
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          if (-not $section) { $section = "See [CHANGELOG.md](CHANGELOG.md)." }
          $notes = @(
            $section,
            "",
            "## Install",
            "",
            "Download the ``.msi`` (installs for all users) or the ``-setup.exe`` (installs for you only). The installers are not code-signed yet, so Windows SmartScreen may warn before running them. Models are downloaded separately; see the README.",
            "",
            "## SHA-256",
            "",
            '```text',
            (Get-Content -Raw release-assets/SHA256SUMS).Trim(),
            '```'
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          $existing = gh release view $env:TAG --json isDraft --jq .isDraft 2>$null
          if ($existing -eq "true") {
            gh release upload $env:TAG (Get-ChildItem release-assets -File).FullName --clobber
          }
          elseif ($existing) {
            throw "A published release for $env:TAG already exists; not changing it."
          }
          else {
            gh release create $env:TAG --draft --verify-tag --title "LocalFlow $env:VERSION" --notes-file release-notes.md (Get-ChildItem release-assets -File).FullName
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed (exit code $LASTEXITCODE)." }
