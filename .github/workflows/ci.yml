name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit; the comment names the release. Dependabot
# (.github/dependabot.yml) proposes updates.
jobs:
  web:
    name: Web checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only what ships in the app; development tools are not audited here.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # rustup is on the runner; install exactly the toolchain rust-toolchain.toml names.
      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          # rust-toolchain.toml names the toolchain; 1.96 is the minimum in src-tauri/Cargo.toml.
          $channel = "1.96"
          if (Test-Path rust-toolchain.toml) {
            $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy
          rustup default $channel
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # The Tauri build script embeds the built web UI and copies the bundled speech runtime.
      # Neither is in the repository, so build the first and stand in empty files for the
      # second: one for every bundle resource under .localflow-runtime. No test runs these
      # binaries: tests that need real engines are `#[ignore]`d.
      - run: npm ci
      - run: npm run build
      - name: Create placeholder runtime files
        shell: pwsh
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          foreach ($source in $config.bundle.resources.PSObject.Properties.Name) {
            if ($source -notlike "../.localflow-runtime/*") { continue }
            $path = Join-Path "src-tauri" $source
            New-Item -ItemType Directory -Force (Split-Path -Parent $path) | Out-Null
            if (-not (Test-Path -LiteralPath $path)) { New-Item -ItemType File $path | Out-Null }
          }

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --release --lib --examples --locked -- -D warnings
      # Release profile: the in-process speech engine compiles C++ and the debug cache is huge.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --release --lib --locked
      - name: Build the examples (benchmarks and test stand-ins)
        working-directory: src-tauri
        run: cargo build --release --examples --locked
      # Informational here; the release workflow refuses to build with stale notices.
      - name: Third-party notices are up to date
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Generate-ThirdPartyNotices.ps1 -Check
